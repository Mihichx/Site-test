<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="wrapper"> 
        <header class="clearfix">
            <a href="index.html" id="logo">
                <span class="pink">
                    Сайт
                </span> 
                <i>визитка</i>
            </a>
            <nav id="mainnav">
                <ul>
                    <li><a href="uslugi.html">Услуги</a></li>
                    <li><a href="aboutus.html">О нас</a></li>
                    <li><a href="clients.html">Клиенты</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <form action="" id="contact-form">
                <div class="form_item">
                    <label for="topic">Тема</label><br>
                    <select name="topic" id="topic">
                        <option value="1">Заказать услугу</option>
                        <option value="2">Оставить отзыв/замечание</option>
                        <option value="3">Предложить сотрудничество</option>
                        <option value="4">Другое</option>
                    </select>
                </div>
                <div class="form_item">
                    <label for="name">Имя</label><br>
                    <input name="name" id="name" type="text" placeholder="Максим" required>
                </div>
                <div class="form_item">
                    <label for="email">E-mail</label><br>
                    <input name="email" id="email" type="email" placeholder="eshkere@gamil.com" required>
                </div>
                <div class="form_item">
                    <label for="tel">Телефон</label><br>
                    <input name="tel" id="tel" type="tel" placeholder="Не обязательно">
                </div>
                <div class="form_item">
                    <label for="date">Дата</label><br>
                    <input name="date" id="date" type="date" placeholder="eshkere@gamil.com" required>
                </div>
                <div class="form_item">
                    <label for="message">Текст сообщения</label><br>
                    <textarea name="message" id="message"cols="30" rows="10" placeholder="Мне всё понравилось" required></textarea>
                </div>
                <div class="form_item">
                    <input type="submit">
                </div>
            </form>
        </main>
    </div>
    <footer>
        <p class="footer__block">
            Написать нам &#9650
        </p>
        <p class="footer__block">
            &copy; Новая компания
        </p>
        <div class="footer__icons">
            <a href="https://www.twitch.tv/mi_hich_x" target="_blank">
                <img src="img/twitch.png" class="footer__img">
            </a>
            <a href="http://vk.com" target="_blank">
                <img src="img/vk.png" class="footer__img">
            </a>
            <a href="http://facebook.com" target="_blank">
                <img src="img/facebook.png" class="footer__img">
            </a>
        </div>
    </footer>
</body>
</html>
